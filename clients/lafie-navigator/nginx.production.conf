server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API : proxy /api/* vers le backend (strip du préfixe /api).
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets hashés par Vite (contenu immuable) : cache long.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html + service worker : jamais mis en cache, toujours revalidés,
    # pour que la dernière version soit prise en compte sans vider le cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA : fallback vers index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
